appId: com.bid-typesetting.app
productName: 文版猩
directories:
  buildResources: build
files:
  - dist/**/*
  - electron/main.js
artifactName: "${productName}-Setup-${version}-${os}-${arch}.${ext}"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 文版猩
